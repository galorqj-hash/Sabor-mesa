<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sabor Mesa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #fff8f0;
      color: #333;
    }

    header {
      background: #d35400;
      color: white;
      padding: 25px;
      text-align: center;
    }

    .contenedor {
      max-width: 900px;
      margin: auto;
      padding: 25px;
    }

    .plato {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ccc;
    }

    .precio {
      color: #d35400;
      font-weight: bold;
      font-size: 20px;
    }

    button {
      background: #d35400;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<header>
  <h1>🍽️ Sabor Mesa</h1>
  <p>El sabor que quieres, en tu mesa</p>
</header>

<div class="contenedor">

  <h2>Nuestro menú</h2>

  <div class="plato">
    <h3>🍗 Pollo a la plancha</h3>
    <p>Pollo acompañado de arroz y ensalada.</p>
    <p class="precio">$5.00</p>
    <button>Ordenar</button>
  </div>

  <div class="plato">
    <h3>🍔 Hamburguesa Sabor Mesa</h3>
    <p>Hamburguesa especial con papas fritas.</p>
    <p class="precio">$4.50</p>
    <button>Ordenar</button>
  </div>

  <div class="plato">
    <h3>🍕 Pizza familiar</h3>
    <p>Pizza con queso, jamón y vegetales.</p>
    <p class="precio">$10.00</p>
    <button>Ordenar</button>
  </div>

</div>
<script>
document.querySelectorAll("button").forEach(function(boton) {
  boton.addEventListener("click", function() {
    let nombre = prompt("¿Cuál es tu nombre?");
    if (!nombre) return;

    let mesa = prompt("¿Cuál es tu número de mesa?");
    if (!mesa) return;

    alert("¡Pedido recibido, " + nombre + "! Mesa " + mesa + ".");
  });
});
</script>
</body>
</html>
